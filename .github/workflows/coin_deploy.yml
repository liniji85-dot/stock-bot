name: Hourly Coin Bot

on:
  schedule:
    # 💡 매시간 0분(정각)마다 자동으로 실행 (한국 시간 매 시 정각)
    - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-coin-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 💡 업비트 공식 라이브러리 설치
        pip install requests pandas pyupbit

    - name: Run Coin Bot
      run: python coin_bot.py
