name: Hourly Coin Bot

on:
  schedule:
    # 매 정각(매 시 0분)마다 자동으로 실행 (영국 표준시 기준 매 시 0분)
    - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-coin-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run Coin Bot
      run: python coin_bot.py
