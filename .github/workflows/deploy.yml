name: Daily Stock Bot

on:
  schedule:
    # ⚠️ GitHub Actions는 UTC 기준이므로 한국 시간(KST)에서 9시간을 뺀 시간으로 설정합니다.
    # 주말(토, 일)에는 장이 열리지 않으므로 '1-5'(월~금) 조건을 넣어 평일만 실행되게 했습니다.
    
    # 1. 한국 시간 오전 09:10 (UTC 00:10) -> 장 시작 직후 타점
    - cron: '10 0 * * 1-5'
    
    # 2. 한국 시간 오전 11:30 (UTC 02:30) -> 오전장 주도주 포착
    - cron: '30 2 * * 1-5'
    
    # 3. 한국 시간 오후 02:00 (UTC 05:00) -> 오후장 변동성 포착
    - cron: '0 5 * * 1-5'
    
    # 4. 한국 시간 오후 03:40 (UTC 06:40) -> 장 마감 직후 최종 종가 타점
    - cron: '40 6 * * 1-5'

  workflow_dispatch: # 수동 실행 버튼 유지

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # ⚠️ 에러를 유발하던 캐시 설정을 제거하여 정상 동작하도록 수정했습니다.

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas finance-datareader

    - name: Run Stock Bot
      run: python bot.py
