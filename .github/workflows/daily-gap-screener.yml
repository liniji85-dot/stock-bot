# 이 파일은 저장소 안의 .github/workflows/daily-gap-screener.yml 경로에 넣어야 합니다.
# (폴더를 그대로 .github/workflows 로 만들어서 이 파일을 그 안에 넣으시면 됩니다)

name: Daily Gap Down Screener

on:
  schedule:
    # cron은 UTC 기준입니다. 22:00 UTC = 07:00 KST(다음날) 입니다.
    # "0-4"는 UTC 기준 일~목요일을 의미하며, 이는 KST 기준 월~금요일 아침 7시에 해당합니다.
    # (주식시장이 열리는 평일에만 실행되도록 설정)
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}   # 이걸 추가해두면 GitHub 화면에서 수동으로도 즉시 테스트 실행 가능

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 전종목 조회라 시간이 걸리므로 넉넉히 설정

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 패키지 설치
        run: pip install pykrx pandas

      - name: 스크리너 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python gap_down_screener.py

      - name: 이메일 본문용 요약 생성 (상위 10개)
        if: always()
        run: |
          python - <<'EOF'
          import pandas as pd
          import os

          if os.path.exists("gap_down_result.csv"):
              df = pd.read_csv("gap_down_result.csv")
              top = df.head(10)
              html = "<h3>오늘의 갭하락 스크리닝 결과 (상위 10개)</h3>"
              html += f"<p>전체 {len(df)}건 발견. 전체 목록은 첨부된 CSV를 확인하세요.</p>"
              html += top.to_html(index=False)
          else:
              html = "<p>오늘은 조건을 만족하는 종목이 없었습니다.</p>"

          with open("email_body.html", "w", encoding="utf-8") as f:
              f.write(html)
          EOF

      - name: 이메일 발송
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[갭하락 스크리너] ${{ github.run_id }} 결과"
          html_body: file://email_body.html
          to: ${{ secrets.MAIL_TO }}
          from: Gap Screener Bot <${{ secrets.MAIL_USERNAME }}>
          attachments: gap_down_result.csv
